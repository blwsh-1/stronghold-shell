name: Build APK

on:
  workflow_dispatch:            # 手动触发
    inputs:
      version:                  # 可选：指定上游版本号（不填则自动查最新）
        description: '上游版本号，如 0.2.5（留空=自动取最新）'
        required: false
        default: ''
  push:
    tags: ['v*']                # 打 v* 标签时自动构建

permissions:
  contents: write               # 允许创建 Release 并上传 asset

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 注：ubuntu-latest runner 已预装 Android SDK，直接用，无需 setup-android
      - name: 显示环境
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-未设置}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-未设置}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}" 2>/dev/null | head
          which gradle && gradle --version || echo "未找到全局 gradle"

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # 下载 libnode.so 到 jniLibs（不把 60MB 二进制存进仓库）
      - name: 准备 libnode.so
        run: bash scripts/fetch_libnode.sh

      # ⭐ 启动器模式：不再内置游戏包（APK 体积小、不含素材，合规）
      #    游戏内容由用户自行导入上游完整包 zip。
      - name: 版本号（启动器版本）
        id: ver
        run: |
          # 手动触发时以输入为准；否则从 app/build.gradle.kts 读 versionName
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ]; then
            V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          fi
          V="${V:-1.0.0}"
          V="${V#v}"   # 去掉可能的 v 前缀，避免出现 vv
          [ -n "$V" ] || V="1.0.0"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "启动器版本 = $V"

      - name: 生成 Gradle Wrapper（若缺失）
        run: |
          if [ ! -f ./gradlew ]; then
            echo "==> gradlew 缺失，用全局 gradle 生成 wrapper"
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x ./gradlew

      - name: 构建 Release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: 收集 APK 并正式命名
        id: apk
        run: |
          V="${{ steps.ver.outputs.version }}"
          NAME="StrongholdShell-launcher-v${V}-android.apk"
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/${NAME}"
          ls -lh out/
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          # 记录 SHA-256，写进 Release 说明
          SHA=$(sha256sum "out/${NAME}" | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "$NAME SHA-256: $SHA"

      - name: 上传 APK 产物（备份）
        uses: actions/upload-artifact@v4
        with:
          name: stronghold-shell-launcher-apk
          path: out/*.apk
          if-no-files-found: error

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-v${{ steps.ver.outputs.version }}
          name: 卫戍协议启动器 v${{ steps.ver.outputs.version }}
          body: |
            **《卫戍协议：盟约》安卓启动器** —— 不含游戏内容的空壳，导入上游完整包即可游玩。

            ## 怎么用
            1. 安装本 APK（`${{ steps.apk.outputs.name }}`）
            2. 从上游 `sganggs/Stronghold-Protocol` 的 Releases 下载**完整包**
               （`Stronghold-Protocol-vX.Y.Z.zip`，约 550 MB）到手机
            3. 打开启动器 → 点「导入游戏包 (.zip)」→ 选中那个 zip
            4. 等待解压（首次几十秒）→ 点「启动游戏」

            ## 为什么这样设计
            - 启动器**不含**任何游戏素材（美术/音频/立绘），合规且体积小
            - 游戏本体来自上游，版权归原作者与鹰角网络
            - 以后上游更新，**不用重装启动器**，重新导入新包即可

            ## 校验
            - SHA-256: `${{ steps.apk.outputs.sha256 }}`

            > 非官方同人作品，游戏素材版权归上海鹰角网络 / Yostar，仅供学习交流、严禁盈利。
          files: out/*.apk
          draft: false
          prerelease: false