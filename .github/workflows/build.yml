name: Build APK

on:
  workflow_dispatch:            # 手动触发
    inputs:
      version:                  # 可选：指定上游版本号（不填则自动查最新）
        description: '上游版本号，如 0.2.5（留空=自动取最新）'
        required: false
        default: ''
  push:
    tags: ['v*']                # 打 v* 标签时自动构建

permissions:
  contents: write               # 允许创建 Release 并上传 asset

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 注：ubuntu-latest runner 已预装 Android SDK，直接用，无需 setup-android
      - name: 显示环境
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-未设置}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-未设置}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}" 2>/dev/null | head
          which gradle && gradle --version || echo "未找到全局 gradle"

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # 下载 libnode.so 到 jniLibs（不把 60MB 二进制存进仓库）
      - name: 准备 libnode.so
        run: bash scripts/fetch_libnode.sh

      # 下载上游游戏包并打包成 app_bundle.zip 放 assets（可选）
      - name: 准备 app_bundle（若提供了下载脚本）
        env:
          SP_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -f scripts/fetch_bundle.sh ]; then
            bash scripts/fetch_bundle.sh
          else
            echo "未提供 fetch_bundle.sh，跳过素材打包（产出的 APK 将不含游戏内容）"
          fi

      - name: 读取上游版本号
        id: ver
        run: |
          V=$(cat app/src/main/assets/bundle.sha256 2>/dev/null | sed 's/-patched$//' | tr -d '\n')
          [ -n "$V" ] || V="${{ github.event.inputs.version }}"
          [ -n "$V" ] || V="unknown"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "上游版本 = $V"

      - name: 生成 Gradle Wrapper（若缺失）
        run: |
          if [ ! -f ./gradlew ]; then
            echo "==> gradlew 缺失，用全局 gradle 生成 wrapper"
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x ./gradlew

      - name: 构建 Release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: 收集 APK 并正式命名
        id: apk
        run: |
          V="${{ steps.ver.outputs.version }}"
          NAME="Stronghold-Protocol-v${V}-android.apk"
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/${NAME}"
          ls -lh out/
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          # 记录 SHA-256，写进 Release 说明
          SHA=$(sha256sum "out/${NAME}" | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "$NAME SHA-256: $SHA"

      - name: 上传 APK 产物（备份）
        uses: actions/upload-artifact@v4
        with:
          name: stronghold-protocol-android-apk
          path: out/*.apk
          if-no-files-found: error

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: 卫戍协议：盟约 v${{ steps.ver.outputs.version }} 安卓版
          body: |
            《卫戍协议：盟约》安卓版（自建壳），基于上游 `sganggs/Stronghold-Protocol` v${{ steps.ver.outputs.version }}。

            **安装**
            - 下载下方的 `${{ steps.apk.outputs.name }}`（约 850 MB）
            - 手机上安装（需允许「安装未知应用」）
            - 要求 Android 7.0（API 24）及以上、arm64-v8a，磁盘留出 1 GB 以上
            - 首次启动会解压游戏资源（几十秒），之后正常进入游戏

            **校验**
            - SHA-256: `${{ steps.apk.outputs.sha256 }}`

            > 非官方同人作品，游戏素材版权归上海鹰角网络 / Yostar，仅供学习交流、严禁盈利。
          files: out/*.apk
          draft: false
          prerelease: false