name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:      # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: 设置 Gradle 权限
        run: chmod +x ./gradlew || true

      - name: 生成 Gradle Wrapper（若缺失）
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.7
            chmod +x ./gradlew
          fi

      # 下载 libnode.so 到 jniLibs（不把 60MB 二进制存进仓库）
      - name: 准备 libnode.so
        run: bash scripts/fetch_libnode.sh

      # 下载上游游戏包并打包成 app_bundle.zip 放 assets（可选，见 README）
      - name: 准备 app_bundle（若提供了下载脚本）
        run: |
          if [ -f scripts/fetch_bundle.sh ]; then
            bash scripts/fetch_bundle.sh
          else
            echo "未提供 fetch_bundle.sh，跳过素材打包（产出的 APK 将不含游戏内容）"
          fi

      - name: 构建 Release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: stronghold-shell-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
