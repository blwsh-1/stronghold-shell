name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:      # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 注：ubuntu-latest runner 已预装 Android SDK，直接用，无需 setup-android
      - name: 显示环境
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-未设置}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-未设置}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}" 2>/dev/null | head
          which gradle && gradle --version || echo "未找到全局 gradle"

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # 下载 libnode.so 到 jniLibs（不把 60MB 二进制存进仓库）
      - name: 准备 libnode.so
        run: bash scripts/fetch_libnode.sh

      # 下载上游游戏包并打包成 app_bundle.zip 放 assets（可选）
      - name: 准备 app_bundle（若提供了下载脚本）
        run: |
          if [ -f scripts/fetch_bundle.sh ]; then
            bash scripts/fetch_bundle.sh
          else
            echo "未提供 fetch_bundle.sh，跳过素材打包（产出的 APK 将不含游戏内容）"
          fi

      - name: 生成 Gradle Wrapper（若缺失）
        run: |
          if [ ! -f ./gradlew ]; then
            echo "==> gradlew 缺失，用全局 gradle 生成 wrapper"
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x ./gradlew

      - name: 构建 Release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: stronghold-shell-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error