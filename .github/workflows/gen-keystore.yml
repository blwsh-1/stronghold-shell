name: Generate Keystore (One-time)

# 一次性用途：生成固定的签名 keystore，输出 base64 供存入 Secrets。
# 用完即删（或保留也无害，它不参与正式构建）。
on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 生成 keystore
        run: |
          set -e
          keytool -genkeypair -v \
            -keystore keystore.jks \
            -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias stronghold \
            -storepass StrongholdShell2026 \
            -keypass StrongholdShell2026 \
            -dname "CN=StrongholdShell, OU=Self, O=huajixiaobai, L=Unknown, ST=Unknown, C=CN"

      - name: 输出 base64（写入日志，供复制到 Secrets）
        run: |
          echo "=================== KEYSTORE_B64_BEGIN ==================="
          base64 -w 0 keystore.jks
          echo ""
          echo "==================== KEYSTORE_B64_END ===================="
          echo "ALIAS = stronghold"
          echo "STORE_PASSWORD = StrongholdShell2026"
          echo "KEY_PASSWORD = StrongholdShell2026"

      - name: 保存为 artifact（备份）
        uses: actions/upload-artifact@v4
        with:
          name: keystore-jks
          path: keystore.jks
